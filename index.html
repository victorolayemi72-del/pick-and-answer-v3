<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick & Answer — The Chemistry Test ❤️‍🔥</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #180d25, #43152f);
      color: white;
      text-align: center;
    }

    .card {
      max-width: 460px;
      margin: 25px auto;
      padding: 25px;
      background: #281932;
      border: 1px solid #75405f;
      border-radius: 20px;
      box-shadow: 0 8px 25px #0005;
    }

    h1 {
      color: #ff80ab;
      font-size: 27px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      background: #fff;
      color: #222;
    }

    button {
      background: #ff4081;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      background: #56375f;
    }

    .hidden {
      display: none;
    }

    #message {
      overflow-wrap: anywhere;
      color: #ffd1e1;
    }

    #players {
      padding: 0;
      list-style: none;
    }

    #players li {
      margin: 8px 0;
      padding: 12px;
      background: #402849;
      border-radius: 10px;
    }

    .status {
      padding: 14px;
      margin-top: 15px;
      border-radius: 10px;
      background: #402849;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Pick & Answer ❤️‍🔥</h1>
    <p>The Chemistry Test</p>

    <div id="lobby">
      <input
        id="playerName"
        maxlength="25"
        placeholder="Enter your name"
        autocomplete="nickname"
      >

      <button id="createBtn">Create a Room</button>

      <hr>

      <input
        id="roomInput"
        maxlength="6"
        placeholder="Enter 6-character room code"
        autocomplete="off"
      >

      <button id="joinBtn" class="secondary">Join a Room</button>
    </div>

    <div id="roomSection" class="hidden">
      <h2>Your Room</h2>

      <p>Room code:</p>
      <h1 id="roomCodeDisplay"></h1>

      <button id="copyBtn" class="secondary">Copy Room Code</button>

      <h3>Players</h3>
      <ul id="players"></ul>

      <div id="waitingMessage" class="status">
        Waiting for the second player...
      </div>

      <button id="startBtn" class="hidden">
        Start Game ❤️‍🔥
      </button>

      <div id="gameSection" class="hidden">
        <h2>Game Started! 🎉</h2>
        <p id="gameStatus" class="status"></p>
        <p id="gameInfo">
          Your shared game state is ready.
        </p>
      </div>

      <button id="returnBtn" class="secondary">Return to Lobby</button>
    </div>

    <p id="message"></p>
  </div>

  <script type="module">
    import {
      signInGuest,
      createRoom,
      joinRoom,
      watchRoomPlayers,
      startGame,
      watchGameState
    } from "./firebase.js";

    let currentUser = null;
    let currentRoom = null;
    let stopPlayersListener = null;
    let stopGameListener = null;
    let currentPlayers = [];

    const $ = (id) => document.getElementById(id);

    function showMessage(message) {
      $("message").textContent = message;
    }

    function getPlayerName() {
      const name = $("playerName").value.trim();

      if (!name || name.length > 25) {
        throw new Error("Enter your name first.");
      }

      return name;
    }

    async function runAction(action) {
      showMessage("");

      try {
        await action();
      } catch (error) {
        console.error(error);
        showMessage(error.message || "Something went wrong. Try again.");
      }
    }

    async function initialize() {
      try {
        currentUser = await signInGuest();
      } catch (error) {
        showMessage("Sign-in failed. Check your Firebase configuration.");
        console.error(error);
        $("createBtn").disabled = true;
        $("joinBtn").disabled = true;
      }
    }

    function openRoom(code) {
      currentRoom = code;
      $("lobby").classList.add("hidden");
      $("roomSection").classList.remove("hidden");
      $("roomCodeDisplay").textContent = code;
      $("startBtn").classList.add("hidden");
      $("gameSection").classList.add("hidden");

      if (stopPlayersListener) stopPlayersListener();
      if (stopGameListener) stopGameListener();

      stopPlayersListener = watchRoomPlayers(
        code,
        (players) => {
          currentPlayers = players;

          $("players").replaceChildren();

          players.forEach((player) => {
            const item = document.createElement("li");
            item.textContent = player.displayName || "Player";
            $("players").appendChild(item);
          });

          const ready = players.length === 2;

          $("waitingMessage").textContent = ready
            ? "Both players have joined! ❤️‍🔥"
            : "Waiting for the second player...";

          $("startBtn").classList.toggle("hidden", !ready);
        },
        (error) => showMessage("Players could not be loaded: " + error.message)
      );

      stopGameListener = watchGameState(
        code,
        (state) => {
          if (!state || state.status !== "playing") return;

          $("gameSection").classList.remove("hidden");
          $("startBtn").classList.add("hidden");
          $("waitingMessage").textContent = "The game is in progress!";

          const activePlayer = currentPlayers.find(
            (player) => player.uid === state.currentPlayerUid
          );

          $("gameStatus").textContent =
            "Current turn: " +
            (activePlayer?.displayName || "Starting player");

          $("gameInfo").textContent =
            "Question " + (state.currentQuestionIndex + 1) +
            " · Score: " + state.player1Score +
            " - " + state.player2Score;
        },
        (error) => showMessage("Game state error: " + error.message)
      );
    }

    $("createBtn").addEventListener("click", () => {
      runAction(async () => {
        const code = await createRoom(currentUser, getPlayerName());
        openRoom(code);
        showMessage("Room created successfully!");
      });
    });

    $("joinBtn").addEventListener("click", () => {
      runAction(async () => {
        const code = await joinRoom(
          currentUser,
          getPlayerName(),
          $("roomInput").value
        );

        openRoom(code);
        showMessage("Joined successfully!");
      });
    });

    $("startBtn").addEventListener("click", () => {
      runAction(async () => {
        $("startBtn").disabled = true;

        try {
          await startGame(currentUser, currentRoom);
          showMessage("Game started successfully! ❤️‍🔥");
        } finally {
          $("startBtn").disabled = false;
        }
      });
    });

    $("copyBtn").addEventListener("click", () => {
      runAction(async () => {
        await navigator.clipboard.writeText(currentRoom);
        showMessage("Room code copied!");
      });
    });

    $("returnBtn").addEventListener("click", () => {
      if (stopPlayersListener) stopPlayersListener();
      if (stopGameListener) stopGameListener();

      currentRoom = null;
      currentPlayers = [];

      $("roomSection").classList.add("hidden");
      $("lobby").classList.remove("hidden");
      $("gameSection").classList.add("hidden");
      $("startBtn").classList.add("hidden");
      $("roomInput").value = "";

      showMessage("");
    });

    initialize();
  </script>
</body>
</html>

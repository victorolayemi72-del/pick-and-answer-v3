<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick & Answer ❤️‍🔥</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe0ec, #ffc2d8);
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px 22px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 8px 28px #0002;
    }
    h1 { color: #e91e63; margin-bottom: 5px; }
    .subtitle { color: #777; margin-bottom: 25px; }
    input, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 10px;
      font-size: 16px;
    }
    input {
      border: 1px solid #ddd;
      outline-color: #e91e63;
    }
    button {
      border: none;
      background: #e91e63;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    .secondary { background: #7c4dff; }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #444;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Pick & Answer ❤️‍🔥</h1>
    <p class="subtitle">The Chemistry Test</p>

    <input id="playerName" type="text"
      maxlength="25" placeholder="Enter your name">

    <button id="createRoom">Create a Room</button>

    <hr style="border:0;border-top:1px solid #eee;margin:20px 0;">

    <input id="roomCode" type="text"
      maxlength="20" placeholder="Enter room code">

    <button id="joinRoom">Join a Room</button>

    <button class="secondary" id="adminButton">Admin Panel</button>

    <p id="status">Welcome! Let's get started.</p>
  </main>

  <script type="module">
    import { signInGuest } from "./firebase.js";

    const status = document.getElementById("status");
    const nameInput = document.getElementById("playerName");
    const createButton = document.getElementById("createRoom");
    const joinButton = document.getElementById("joinRoom");
    const adminButton = document.getElementById("adminButton");

    async function connectGuest() {
      const name = nameInput.value.trim();

      if (!name) {
        status.textContent = "Please enter your name first.";
        nameInput.focus();
        return;
      }

      status.textContent = "Connecting to Firebase...";

      createButton.disabled = true;
      joinButton.disabled = true;

      try {
        const user = await signInGuest();
        status.textContent =
          "Firebase connected successfully! Welcome, " + name + ".";
        console.log("Guest signed in:", user.uid);
      } catch (error) {
        console.error(error);
        status.textContent =
          "Connection failed: " + error.message;
      } finally {
        createButton.disabled = false;
        joinButton.disabled = false;
      }
    }

    createButton.addEventListener("click", connectGuest);
    joinButton.addEventListener("click", async () => {
      const code = document.getElementById("roomCode").value.trim();

      if (!code) {
        status.textContent = "Please enter a room code.";
        return;
      }

      await connectGuest();

      if (status.textContent.startsWith("Firebase connected")) {
        status.textContent =
          "Firebase connected. Room joining will be added next.";
      }
    });

    adminButton.addEventListener("click", () => {
      status.textContent =
        "The secure Admin Panel will be connected in a later step.";
    });
  </script>
</body>
</html>

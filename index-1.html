<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff4f87">
  <title>Pick &amp; Answer ❤️‍🔥</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 20px;
      display: flex; align-items: center; justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f5, #ffe0eb);
      color: #381527;
    }
    .container {
      width: 100%; max-width: 430px; padding: 28px 22px;
      background: #fff; border-radius: 24px;
      box-shadow: 0 12px 35px #8c31551c; text-align: center;
    }
    .logo { font-size: 52px; margin-bottom: 8px; }
    h1 { margin: 0; color: #e73576; font-size: 29px; }
    .subtitle { color: #765465; margin-bottom: 25px; line-height: 1.5; }
    label { display: block; text-align: left; margin: 15px 0 7px; font-weight: bold; }
    input {
      width: 100%; padding: 14px; border: 1px solid #f0bfd1;
      border-radius: 12px; font-size: 16px; outline-color: #e73576;
    }
    button {
      width: 100%; padding: 14px; margin-top: 14px; border: 0;
      border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    .primary { background: #e73576; color: #fff; }
    .secondary { background: #fff0f5; color: #c72864; }
    .admin { background: #292238; color: #fff; }
    #status { min-height: 22px; margin-top: 15px; font-size: 14px; overflow-wrap: anywhere; }
    footer { margin-top: 22px; color: #987d8b; font-size: 12px; }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo" aria-hidden="true">💗🎮</div>
    <h1>Pick &amp; Answer</h1>
    <p class="subtitle">
      The Chemistry Test ❤️‍🔥<br>
      Two players. One room. Let's see how well you know each other!
    </p>

    <label for="playerName">Your name</label>
    <input id="playerName" type="text" maxlength="30" placeholder="Enter your name" autocomplete="nickname">

    <button class="primary" id="createRoom" type="button">Create a Room</button>

    <label for="roomCode">Have a room code?</label>
    <input id="roomCode" type="text" maxlength="12" placeholder="Enter room code" autocomplete="off">

    <button class="secondary" id="joinRoom" type="button">Join a Room</button>
    <button class="admin" id="adminButton" type="button">🔐 Admin Panel</button>

    <p id="status" role="status" aria-live="polite"></p>
    <footer>Pick &amp; Answer © 2026</footer>
  </main>

  <script>
    document.getElementById("createRoom").addEventListener("click", () => {
      const name = document.getElementById("playerName").value.trim();
      document.getElementById("status").textContent = name
        ? "Room creation will be enabled when Firebase is connected."
        : "Please enter your name first.";
    });

    document.getElementById("joinRoom").addEventListener("click", () => {
      const name = document.getElementById("playerName").value.trim();
      const code = document.getElementById("roomCode").value.trim();
      if (!name) {
        document.getElementById("status").textContent = "Please enter your name first.";
      } else if (!code) {
        document.getElementById("status").textContent = "Please enter a room code.";
      } else {
        document.getElementById("status").textContent =
          "Room joining will be enabled when Firebase is connected.";
      }
    });

    document.getElementById("adminButton").addEventListener("click", () => {
      document.getElementById("status").textContent =
        "Administrator sign-in will be connected in a later step.";
    });
  </script>
</body>
</html>

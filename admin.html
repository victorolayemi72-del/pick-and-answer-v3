<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pick & Answer Admin</title><link rel="stylesheet" href="admin.css"></head>
<body><main class="admin-app">
<header><div><h1>🛠️ Pick &amp; Answer Admin</h1><p>Manage question bank and categories</p></div><a href="index.html">← Back to game</a></header>
<div id="adminNotice" class="notice" role="status"></div>
<section class="panel" id="loginPanel"><h2>Administrator sign-in</h2><p>Sign in with the Google account that is authorized in Firestore rules.</p><button id="adminLogin" class="primary">Continue with Google</button><p class="muted">If sign-in is blocked, enable Google as a provider in Firebase Authentication.</p></section>
<section class="panel hidden" id="managerPanel">
<div class="row"><h2>Question manager</h2><button id="adminLogout" class="secondary">Sign out</button></div>
<form id="questionForm">
<input id="editId" type="hidden">
<label for="qText">Question</label><textarea id="qText" required maxlength="1000" rows="3" placeholder="Type the question"></textarea>
<label for="qCategory">Category</label><input id="qCategory" required maxlength="60" placeholder="Biology, Chemistry, Aptitude…">
<div class="options-grid">
<div><label for="option0">Option A</label><input id="option0" required maxlength="300"></div>
<div><label for="option1">Option B</label><input id="option1" required maxlength="300"></div>
<div><label for="option2">Option C</label><input id="option2" maxlength="300"></div>
<div><label for="option3">Option D</label><input id="option3" maxlength="300"></div>
</div>
<label for="correctAnswer">Correct answer</label><select id="correctAnswer" required><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
<label class="check"><input id="qActive" type="checkbox" checked> Active (include in games)</label>
<div class="row"><button class="primary" type="submit" id="saveQuestion">Save question</button><button class="secondary" type="button" id="clearForm">Clear form</button></div>
</form>
<div class="row list-heading"><h2>Questions</h2><span id="questionCount">0 questions</span></div>
<label for="filterCategory">Filter by category</label><select id="filterCategory"><option value="">All categories</option></select>
<div id="questionList" class="question-list"></div>
</section>
</main><script type="module" src="admin.js"></script></body></html>
